<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Sprite Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111923; color: #eef8f4; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 22px; background: rgba(17, 25, 35, .94); border-bottom: 1px solid #30434a; backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: 20px; }
    .meta { color: #a9c1ba; font-size: 13px; }
    button, label { font: inherit; }
    button { border: 1px solid #54766d; border-radius: 9px; padding: 8px 12px; background: #20332f; color: #eef8f4; cursor: pointer; }
    label { display: flex; gap: 7px; align-items: center; color: #c5d8d3; font-size: 13px; }
    main { padding: 22px; }
    section { margin: 0 0 30px; }
    h2 { margin: 0 0 12px; color: #b7e4b8; font-size: 16px; text-transform: uppercase; letter-spacing: .12em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .card { min-width: 0; padding: 14px; border: 1px solid #2d4046; border-radius: 14px; background: #18242e; box-shadow: 0 12px 30px rgba(0, 0, 0, .18); }
    .stage { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 230px; border-radius: 10px; background-color: #eaf5ee; background-image: linear-gradient(45deg, #d8e6e2 25%, transparent 25%), linear-gradient(-45deg, #d8e6e2 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d8e6e2 75%), linear-gradient(-45deg, transparent 75%, #d8e6e2 75%); background-position: 0 0, 0 12px, 12px -12px, -12px 0; background-size: 24px 24px; }
    .stage.baseline::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% + 112px); height: 1px; background: rgba(249, 80, 94, .55); pointer-events: none; }
    canvas { width: 256px; height: 256px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; align-items: baseline; }
    .name { font-weight: 700; }
    .spec { color: #91aaa4; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Pet sprites</h1>
    <span class="meta" id="meta"></span>
    <button id="toggle">Пауза</button>
    <label><input type="checkbox" id="baseline"> базовая линия y=120</label>
  </header>
  <main id="app"></main>
  <script src="manifest.js"></script>
  <script>
    const manifest = window.PET_MANIFEST;
    const root = document.getElementById('app');
    const players = [];
    let paused = false;
    document.getElementById('meta').textContent = `${manifest.totalFrames} кадров · ${manifest.frameSize}×${manifest.frameSize} · ${manifest.palette.length} цветов`;

    for (const [setName, animations] of Object.entries(manifest.sets)) {
      const section = document.createElement('section');
      section.innerHTML = `<h2>${setName}</h2><div class="grid"></div>`;
      const grid = section.querySelector('.grid');
      root.append(section);
      for (const [name, spec] of Object.entries(animations)) {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<div class="stage"><canvas width="128" height="128"></canvas></div><div class="row"><span class="name">${name}</span><span class="spec">${spec.frames}f · ${spec.fps || '—'} fps · ${spec.loop ? 'loop' : 'once'}</span></div>`;
        grid.append(card);
        const canvas = card.querySelector('canvas');
        const context = canvas.getContext('2d');
        context.imageSmoothingEnabled = false;
        const image = new Image();
        image.src = spec.file;
        players.push({ image, context, spec, started: performance.now() });
      }
    }

    function draw(now) {
      for (const player of players) {
        if (!player.image.complete) continue;
        const { spec, image, context } = player;
        let frame = 0;
        if (spec.frames > 1 && spec.fps > 0) {
          const elapsed = Math.max(0, now - player.started);
          const duration = spec.frames * 1000 / spec.fps;
          if (spec.loop) frame = Math.floor(elapsed * spec.fps / 1000) % spec.frames;
          else {
            const cycle = duration + 1200;
            const point = elapsed % cycle;
            frame = point >= duration ? spec.frames - 1 : Math.floor(point * spec.fps / 1000);
          }
        }
        context.clearRect(0, 0, 128, 128);
        context.drawImage(image, frame * 128, 0, 128, 128, 0, 0, 128, 128);
      }
      if (!paused) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    document.getElementById('toggle').addEventListener('click', (event) => {
      paused = !paused;
      event.currentTarget.textContent = paused ? 'Продолжить' : 'Пауза';
      if (!paused) {
        const now = performance.now();
        players.forEach(player => player.started = now);
        requestAnimationFrame(draw);
      }
    });
    document.getElementById('baseline').addEventListener('change', (event) => {
      document.querySelectorAll('.stage').forEach(stage => stage.classList.toggle('baseline', event.target.checked));
    });
  </script>
</body>
</html>
